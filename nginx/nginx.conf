worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream linksnip_redirect {
        least_conn;

        server host.docker.internal:8001 max_fails=3 fail_timeout=10s;
        server host.docker.internal:8002 max_fails=3 fail_timeout=10s;
        server host.docker.internal:8003 max_fails=3 fail_timeout=10s;

        keepalive 32;
    }

    server {
        listen 80;

        server_name _;

        location / {
            proxy_pass http://linksnip_redirect;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Connection "";

            proxy_connect_timeout 2s;

            proxy_send_timeout 5s;

            proxy_read_timeout 5s;
        }

        location /health {
            proxy_pass http://linksnip_redirect/health;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}